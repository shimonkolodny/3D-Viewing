name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v0.1.0 (creates the tag and a GitHub Release)"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]
    branches: ["claude/**"]   # CI builds on work branches; only tags / manual runs publish a release

permissions:
  contents: write

env:
  MODEL_URL: https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx
  MODEL_SHA256: afb6a5c28f3b6bf1618c6e43f02073ef9dfdc70e937502d51603e57b0a1df10c

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r app/requirements.txt pytest
      - run: python -m pytest -q app/tests
      - name: Check extension syntax
        run: |
          for f in extension/src/*.js extension/popup/popup.js; do node --check "$f"; done
          python -c "import json; json.load(open('extension/manifest.json'))"

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install build dependencies
        run: pip install -r app/requirements-build.txt
      - name: Download and verify depth model (Depth Anything V2 Small, Apache-2.0)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile models/depth_anything_v2_small.onnx
          $h = (Get-FileHash models/depth_anything_v2_small.onnx -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:MODEL_SHA256) { throw "Model checksum mismatch: $h" }
      - name: Build app with PyInstaller
        working-directory: app
        shell: pwsh
        run: |
          pyinstaller run.py --name 3D-Viewing --noconfirm --windowed --onedir `
            --collect-binaries onnxruntime --collect-submodules websockets `
            --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --exclude-module IPython
          if (-not (Test-Path dist/3D-Viewing/3D-Viewing.exe)) { throw "exe not built" }
      - name: Smoke test the built exe (real WebSocket round trip)
        shell: pwsh
        run: |
          pip install websockets numpy
          python tools/smoke_test.py (Resolve-Path models/depth_anything_v2_small.onnx) (Resolve-Path app/dist/3D-Viewing/3D-Viewing.exe)
      - name: Assemble release folder
        shell: pwsh
        run: |
          $dest = "app/dist/3D-Viewing/models"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item models/depth_anything_v2_small.onnx $dest/
          Copy-Item docs/APP-README.txt app/dist/3D-Viewing/README.txt
          Copy-Item LICENSE app/dist/3D-Viewing/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.md app/dist/3D-Viewing/THIRD-PARTY-NOTICES.md
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path app/dist/3D-Viewing -DestinationPath 3D-Viewing-App-Windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: 3D-Viewing-App-Windows-x64.zip
          if-no-files-found: error

  package-extension:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: cd extension && zip -r ../3D-Viewing-Chrome-Extension.zip . -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: 3D-Viewing-Chrome-Extension.zip
          if-no-files-found: error

  release:
    needs: [build-windows, package-extension]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Checksums
        run: |
          cd dist && mv app-windows/*.zip . && mv extension/*.zip . && rmdir app-windows extension
          sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT; else echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT; fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 3D Viewing ${{ steps.v.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/3D-Viewing-App-Windows-x64.zip
            dist/3D-Viewing-Chrome-Extension.zip
            dist/SHA256SUMS.txt
